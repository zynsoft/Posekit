<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>PoseKit – match any pose</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Cpath d='M9 13V9h4M23 13V9h-4M9 19v4h4M23 19v4h-4' stroke='%2356d8ff' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="view on">
    <header class="hd">
      <div class="logo"><i></i>PoseKit</div>
      <span class="pill">On-device AI</span>
    </header>
    <div class="scroll">
      <div class="hero">
        <h1>See the pose.<br>Stand in it.</h1>
        <p>Pick a reference. We trace the person, you line up on your camera.</p>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search poses" autocomplete="off">
      </label>
      <div id="cats" class="chips"></div>
      <button id="upl" class="up"><b>+</b> Use your own reference photo<small>Stays on your phone</small></button>
      <input id="file" type="file" accept="image/*" hidden>
      <div id="sections"></div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editor" class="view">
    <div class="stage" id="stage" data-s="load">
      <video id="vid" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <i class="vf a"></i><i class="vf b"></i><i class="vf c"></i><i class="vf d"></i>

      <div class="top">
        <button id="back" class="ib" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div id="ttl" class="ttl"></div>
        <button id="swap" class="ib" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg></button>
      </div>

      <div class="msg load"><div class="spin"></div><p id="loadTxt">Loading…</p></div>
      <div class="msg err"><p id="errTxt"></p><button id="errBtn" class="btn">Try again</button></div>
      <button id="start" class="btn big">Start camera</button>
      <div id="cd" class="cd"></div><div id="flash"></div>

      <div class="dock">
        <div class="panel" id="panel">
          <div class="pg" data-p="adj">
            <label class="rw"><span>Opacity</span><input id="op" type="range" min="10" max="100" value="80"><output></output></label>
            <label class="rw"><span>Size</span><input id="sc" type="range" min="40" max="200" value="100"><output></output></label>
            <label class="rw"><span>Left / right</span><input id="px" type="range" min="-100" max="100" value="0"><output></output></label>
            <label class="rw"><span>Up / down</span><input id="py" type="range" min="-100" max="100" value="0"><output></output></label>
            <div class="rw"><span>Colour</span><div id="sw" class="sw"></div><button id="reset" class="btn sm">Reset</button></div>
          </div>
          <div class="pg" data-p="ghost">
            <label class="rw"><span>Ghost photo</span><input id="gh" type="checkbox" class="tg"></label>
            <label class="rw"><span>Transparency</span><input id="go" type="range" min="10" max="100" value="40"><output></output></label>
          </div>
          <div class="pg" data-p="timer"><div class="seg" id="tm"><button data-t="0" class="on">Off</button><button data-t="3">3s</button><button data-t="5">5s</button><button data-t="10">10s</button></div></div>
        </div>
        <div class="bar">
          <button class="tab" data-t="adj"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Adjust</button>
          <button class="tab" data-t="ghost"><svg viewBox="0 0 24 24"><path d="M6 20V10a6 6 0 0112 0v10l-3-2-3 2-3-2z"/></svg>Ghost</button>
          <button id="shutter" class="shutter" aria-label="Capture"><span></span></button>
          <button class="tab" data-t="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 2M10 3h4"/></svg><em id="tmLbl">Timer</em></button>
          <button id="flip" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7L3 17h5zM16 7l5 10h-5z"/></svg>Flip</button>
        </div>
      </div>
    </div>

    <!-- PHOTO PREVIEW -->
    <div id="prev" class="prev">
      <img id="pimg" alt="Captured photo">
      <div class="pbar"><button id="retake" class="btn ghost">Retake</button><button id="save" class="btn">Save to device</button></div>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="script.js"></script>
</body>
</html>
